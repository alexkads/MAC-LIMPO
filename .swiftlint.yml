# SwiftLint config for MAC-LIMPO
# Install: brew install swiftlint  •  Run: swiftlint

included:
  - Models
  - Services
  - ViewModels
  - Views
  - Utilities
  - MACLIMPOApp.swift

excluded:
  - .build
  - MAC-LIMPO.app
  - Design
  - docs
  - Assets.xcassets
  # Design-note markdown and helper scripts live under Services/ but aren't code

# The cleaning services are intentionally long (path lists + scan/clean),
# and the CleaningCategory enum has one giant switch per computed property.
line_length:
  warning: 140
  error: 200
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 500
  error: 800
function_body_length:
  warning: 80
  error: 150
cyclomatic_complexity:
  warning: 25   # CleaningCategory switches span ~35 cases
  error: 40

identifier_name:
  min_length: 2   # allow `a, r, g, b` in Color(hex:)
  excluded:
    - id
    - a
    - r
    - g
    - b

disabled_rules:
  - todo   # design notes use TODO/TEMPORÁRIO markers intentionally

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - sorted_first_last
