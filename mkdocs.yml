site_name: MAC-LIMPO
site_url: https://alexkads.github.io/MAC-LIMPO/
site_description: >-
  Free, open-source macOS disk cleaner for developers. Clean Xcode DerivedData, Docker,
  simulators, node_modules, Rust targets and 40+ caches from the menu bar, and see where
  every gigabyte goes with the Disk X-Ray treemap.
site_author: Alex S S Fonseca
repo_url: https://github.com/alexkads/MAC-LIMPO
repo_name: alexkads/MAC-LIMPO
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025-2026 Alex S S Fonseca and contributors — GPL-3.0-or-later

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alexkads/MAC-LIMPO
      name: MAC-LIMPO on GitHub

nav:
  - Home: index.md
  - Install: install.md
  - Features:
      - Cleaning categories: cleaning.md
      - Disk X-Ray: disk-xray.md
  - Safety: safety.md
  - FAQ: faq.md
  - Development: development.md
  - Changelog: changelog.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true
          site_description: >-
            Limpador de disco gratuito e de código aberto para macOS, feito para desenvolvedores.
            Limpe DerivedData do Xcode, Docker, simuladores, node_modules, targets do Rust e mais de
            40 caches pela barra de menus, e veja para onde vai cada gigabyte com o Disk X-Ray.
          nav_translations:
            Home: Início
            Install: Instalar
            Features: Recursos
            Cleaning categories: Categorias de limpeza
            Safety: Segurança
            Development: Desenvolvimento
            Changelog: Novidades

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
