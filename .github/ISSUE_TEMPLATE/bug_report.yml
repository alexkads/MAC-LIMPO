name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems? Please use a [private report](https://github.com/alexkads/MAC-LIMPO/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the menu bar popover
        2. Click …
  - type: input
    id: app-version
    attributes:
      label: MAC-LIMPO version
      description: Shown at the bottom of the menu bar popover (e.g. "Version 1.3.16 (19)").
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 27.0
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - install.sh (built from source)
        - .pkg installer
        - swift run / Xcode
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: For build failures from install.sh, attach ~/Library/Caches/MAC-LIMPO-build/build.log.
